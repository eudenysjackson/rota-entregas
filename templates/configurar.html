<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração – Rota de Entregas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 520px;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .logo span { color: #6366f1; }
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .hint {
      font-size: 12px;
      font-weight: 400;
      color: #64748b;
      margin-left: 4px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      color: #f1f5f9;
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #6366f1; }
    .group { position: relative; }
    .toggle-eye {
      position: absolute;
      right: 12px;
      top: 10px;
      cursor: pointer;
      color: #64748b;
      font-size: 16px;
      user-select: none;
    }
    .toggle-eye:hover { color: #94a3b8; }
    .info-box {
      background: #1a2744;
      border: 1px solid #2d4a8a;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #93c5fd;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .info-box a { color: #818cf8; }
    button[type="submit"] {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button[type="submit"]:hover { background: #4f46e5; }
    button[type="submit"]:disabled { background: #334155; cursor: default; }
    .msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .msg.ok  { background: #14532d; color: #86efac; border: 1px solid #166534; }
    .msg.err { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
    .details-toggle {
      font-size: 12px;
      color: #64748b;
      cursor: pointer;
      margin-bottom: 8px;
      display: inline-block;
    }
    .details-toggle:hover { color: #94a3b8; }
    .advanced { display: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🐾 Rota de <span>Entregas</span></div>
  <div class="subtitle">Configuração inicial — feita uma única vez</div>

  <div class="info-box">
    Para buscar clientes você precisa de uma <strong>Google API Key</strong>.<br>
    Obtenha gratuitamente em
    <a href="https://console.cloud.google.com/apis/credentials" target="_blank">console.cloud.google.com</a>
    → Credenciais → Criar credencial → Chave de API.<br>
    Ative a <strong>Google Sheets API</strong> no projeto.
  </div>

  <form id="form">
    <label>Google API Key <span class="hint">(obrigatório)</span></label>
    <div class="group">
      <input type="password" id="api_key" placeholder="AIzaSy..." value="{{ api_key }}" autocomplete="off">
      <span class="toggle-eye" onclick="toggleVer()">👁</span>
    </div>

    <span class="details-toggle" onclick="toggleAvancado()">▶ Configurações avançadas</span>
    <div class="advanced" id="avancado">
      <label>ID da Planilha Google Sheets</label>
      <input type="text" id="planilha" value="{{ planilha }}">
      <label>Nome da Aba</label>
      <input type="text" id="aba" value="{{ aba }}">
    </div>

    <button type="submit" id="btn">Salvar e abrir o sistema</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
function toggleVer() {
  const inp = document.getElementById('api_key');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
function toggleAvancado() {
  const el = document.getElementById('avancado');
  const tog = document.querySelector('.details-toggle');
  if (el.style.display === 'block') {
    el.style.display = 'none';
    tog.textContent = tog.textContent.replace('▼','▶');
  } else {
    el.style.display = 'block';
    tog.textContent = tog.textContent.replace('▶','▼');
  }
}

document.getElementById('form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  msg.style.display = 'none';

  const res = await fetch('/api/configurar', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      GOOGLE_API_KEY:   document.getElementById('api_key').value.trim(),
      ID_PLANILHA_BASE: document.getElementById('planilha').value.trim(),
      NOME_ABA_BASE:    document.getElementById('aba').value.trim(),
    })
  });
  const data = await res.json();
  if (data.ok) {
    msg.className = 'msg ok';
    msg.textContent = 'Configuração salva! Redirecionando...';
    msg.style.display = 'block';
    setTimeout(() => window.location.href = '/', 1200);
  } else {
    msg.className = 'msg err';
    msg.textContent = data.msg || 'Erro ao salvar.';
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Salvar e abrir o sistema';
  }
});
</script>
</body>
</html>
